<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel-Pulse Developer Docs</title>
  <style>
    :root {
      --bg: #181a1b;
      --surface: #222526;
      --border: #33373a;
      --text: #e6e6e6;
      --muted: #9da5ad;
      --accent: #f4b400;
      --link: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      border-bottom: 1px solid var(--border);
      padding: 2.5rem 1.5rem;
      background: var(--surface);
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--accent);
      background: rgba(244, 180, 0, 0.12);
      border: 1px solid rgba(244, 180, 0, 0.3);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }
    header p {
      color: var(--muted);
      max-width: 640px;
    }
    main {
      flex: 1;
      padding: 2.5rem 1.5rem;
    }
    h2 {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.4rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    .card-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-tag {
      font-size: 0.72rem;
      font-family: monospace;
      color: var(--muted);
      background: var(--bg);
      padding: 0.15rem 0.45rem;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
    .card p {
      font-size: 0.92rem;
      color: var(--muted);
      margin-bottom: 1rem;
    }
    .card-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--link);
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <span class="badge">Pixel-Pulse</span>
      <h1>Pixel-Pulse Developer Docs</h1>
      
    </div>
  </header>

  <main>
    <div class="container">
      <h2>Projects</h2>
      <div class="grid">
        <a class="card" href="cob-dev/">
          <div>
            <div class="card-title">
              Cob Internals &amp; FFI
              <span class="card-tag">/cob-dev/</span>
            </div>
            <p>Rust workspace documentation for <code>cob_core</code>, <code>cob_abi</code>, <code>cob_drm</code>, <code>popcorn_comp</code>, and standard library modules.</p>
          </div>
          <span class="card-link">Browse Rust API Docs →</span>
        </a>
      </div>
    </div>
  </main>


</body></html>
